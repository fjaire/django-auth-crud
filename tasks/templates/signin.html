{% extends "base.html" %}
{% block content %}
          <main class="container">
            <div class="row justify-content-center">              
                      <section class="col-md-4 ofset-md-4 mt-5">
                            <form action="/signin/" method="POST" class="card card-body">
                                {{error}}
                                {% csrf_token %}
                                <h1 class="text-center">Signin</h1>
                                <div class="mb-3">
                                  <label for="username">Username</label>
                                  <input type="text" name="username" id="username" class="form-control" placeholder="Write your username">
                                </div>
                                <div class="mb-3">
                                  <label for="password">Password</label>
                                  <input type="password" name="password" id="password" class="form-control" placeholder="Write your password">
                                </div>
                                <button class="btn btn-primary">
                                  Signin
                                </button>
                            </form>
                        </section>
              </div>        
          </main>    
{% endblock %}
